#  IDENTIFICACIÓN DEL PROYECTO
sonar.projectKey=devgm10_landing-page
sonar.organization=devgm10
sonar.projectName=landing-page

#  ANÁLISIS
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.spec.js
sonar.sourceEncoding=UTF-8

# ============================================================
#  COBERTURA
#  Reporte generado por Vitest (provider v8, reporter lcov).
#  Sin esta ruta, Sonar reporta 0% aunque existan tests.
# ============================================================
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ------------------------------------------------------------
#  Excluidos de la MÉTRICA de cobertura
#  Nota: siguen analizándose (bugs, smells, duplicación).
#  Solo dejan de contar para el porcentaje.
# ------------------------------------------------------------
#  .vue      → componentes de presentación: template y estilo,
#              sin lógica que un test unitario pueda afirmar.
#  .data.js  → arrays de datos estáticos.
#  .config.js→ configuración declarativa.
#  i18n      → diccionarios de traducción.
#  main.js   → bootstrap de la app.
#  router    → definición declarativa de rutas.
# ------------------------------------------------------------
sonar.cpd.exclusions=**/*.test.js,**/*.spec.js,**/i18n/**,**/locales/**
sonar.coverage.exclusions=**/*.vue,**/*.data.js,**/*.config.js,**/i18n/**,**/main.js,**/router/**,**/*.test.js,**/*.spec.js,**/composables/turnstile/**

#  EXCLUSIONES GENERALES DEL ANÁLISIS
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/public/**,**/assets/**