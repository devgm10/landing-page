name: CI

on:
    pull_request:
        branches: [main]

    push:
        branches: [main]

jobs:
    # ---------- JOB 1: Validar (corre en PR y en push a main) ----------
    validate:
        name: Validar (i18n + build)
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout código
                uses: actions/checkout@v4

            -   name: Setup pnpm
                uses: pnpm/action-setup@v4
                with:
                    version: 10

            -   name: Setup Node
                uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: 'pnpm'

            -   name: Instalar dependencias
                run: pnpm install --frozen-lockfile

            -   name: Validar paridad de traducciones (i18n)
                run: pnpm check:i18n

            -   name: Build (valida que compila)
                run: pnpm build
                env:
                    VITE_CONTACT_API_URL: ${{ secrets.VITE_CONTACT_API_URL }}

    # ---------- JOB 2: Build & Push Docker (SOLO en push a main) ----------
    build-and-push:
        name: Build & Push Docker
        runs-on: ubuntu-latest
        needs: validate
        if: github.event_name == 'push'
        environment: production
        steps:
            -   name: Checkout código
                uses: actions/checkout@v4

            -   name: Login a DockerHub
                uses: docker/login-action@v3
                with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            -   name: Setup Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Build & Push
                uses: docker/build-push-action@v6
                with:
                    context: .
                    platforms: linux/amd64
                    push: true
                    tags: |
                        ${{ secrets.DOCKERHUB_USERNAME }}/landing-page:latest
                        ${{ secrets.DOCKERHUB_USERNAME }}/landing-page:${{ github.sha }}
                    build-args: |
                        VITE_CONTACT_API_URL=${{ secrets.VITE_CONTACT_API_URL }}