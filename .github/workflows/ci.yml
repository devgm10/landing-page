name: CI

on:
    pull_request:
        branches: [main]

    push:
        branches: [main]

jobs:
    validate:
        name: Validate (i18n + build)
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Setup pnpm
                uses: pnpm/action-setup@v4
                with:
                    version: 10

            -   name: Setup Node
                uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: 'pnpm'

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Validate translation parity (i18n)
                run: pnpm check:i18n

            -   name: Build (validates that compiles)
                run: pnpm build
                env:
                    VITE_CONTACT_API_URL: ${{ secrets.VITE_CONTACT_API_URL }}

            -   name: SonarCloud analysis
                uses: SonarSource/sonarqube-scan-action@v6
                env:
                    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

            -   name: Check Quality Gate
                uses: SonarSource/sonarqube-quality-gate-action@master
                timeout-minutes: 5
                env:
                    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    build-and-push:
        name: Build & Push Docker
        runs-on: ubuntu-latest
        needs: validate
        if: github.event_name == 'push'
        environment: production
        steps:
            -   name: Checkout código
                uses: actions/checkout@v4

            -   name: Login a DockerHub
                uses: docker/login-action@v3
                with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            -   name: Setup Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Build & Push
                uses: docker/build-push-action@v6
                with:
                    context: .
                    platforms: linux/amd64
                    push: true
                    tags: |
                        ${{ secrets.DOCKERHUB_USERNAME }}/landing-page:latest
                        ${{ secrets.DOCKERHUB_USERNAME }}/landing-page:${{ github.sha }}
                    build-args: |
                        VITE_CONTACT_API_URL=${{ secrets.VITE_CONTACT_API_URL }}

    deploy:
        name: Deploy a EC2 vía SSM
        runs-on: ubuntu-latest
        needs: build-and-push
        if: github.event_name == 'push'
        environment: production
        permissions:
            id-token: write
            contents: read
        steps:
            -   name: Configurar credenciales AWS (OIDC)
                uses: aws-actions/configure-aws-credentials@v4
                with:
                    role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                    aws-region: ${{ secrets.AWS_REGION }}

            -   name: Buscar instancia por tag
                id: find
                run: |
                    INSTANCE_ID=$(aws ec2 describe-instances \
                        --filters "Name=tag:Name,Values=landing-page-gm-server" \
                                "Name=instance-state-name,Values=running" \
                        --query "Reservations[0].Instances[0].InstanceId" \
                        --output text)
                    echo "Instancia encontrada: $INSTANCE_ID"
                    echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

            -   name: Desplegar vía SSM
                run: |
                    COMMAND_ID=$(aws ssm send-command \
                        --instance-ids "${{ steps.find.outputs.instance_id }}" \
                        --document-name "AWS-RunShellScript" \
                        --parameters 'commands=["cd /home/ubuntu/landing && docker compose pull && docker compose up -d && docker image prune -f"]' \
                        --query "Command.CommandId" \
                        --output text)
                    echo "Comando SSM enviado: $COMMAND_ID"

                    # Esperar y verificar el resultado
                    aws ssm wait command-executed \
                        --command-id "$COMMAND_ID" \
                        --instance-id "${{ steps.find.outputs.instance_id }}" || true

                    STATUS=$(aws ssm get-command-invocation \
                        --command-id "$COMMAND_ID" \
                        --instance-id "${{ steps.find.outputs.instance_id }}" \
                        --query "Status" --output text)
                    echo "Estado del despliegue: $STATUS"

                    if [ "$STATUS" != "Success" ]; then
                        echo "El despliegue falló"
                        aws ssm get-command-invocation \
                        --command-id "$COMMAND_ID" \
                        --instance-id "${{ steps.find.outputs.instance_id }}" \
                        --query "StandardErrorContent" --output text
                        exit 1
                    fi
                    echo "Despliegue exitoso"
