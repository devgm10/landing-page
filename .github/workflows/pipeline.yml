name: CI/CD

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    # ---------- Validación: i18n + build ----------
    validate:
        name: Validate (i18n + Build)
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout code
            uses: actions/checkout@v4
            with:
                fetch-depth: 0

        -   name: Setup pnpm
            uses: pnpm/action-setup@v4

        -   name: Setup Node
            uses: actions/setup-node@v4
            with:
                node-version: 22
                cache: pnpm

        -   name: Install dependencies
            run: pnpm install --frozen-lockfile

        -   name: Validate translation parity
            run: pnpm check:i18n

        -   name: Build project
            run: pnpm build
            env:
                VITE_CONTACT_API_URL: ${{ secrets.VITE_CONTACT_API_URL }}


    # ---------- Análisis de código: SonarCloud ----------
    sonarcloud:
        name: SonarCloud
        runs-on: ubuntu-latest
        needs: validate
        steps:
        -   uses: actions/checkout@v4
            with:
                fetch-depth: 0

        -   name: Setup pnpm
            uses: pnpm/action-setup@v4

        -   uses: actions/setup-node@v4
            with:
                node-version: 22
                cache: pnpm

        -   run: pnpm install --frozen-lockfile

        -   name: Run tests with coverage
            run: pnpm test:coverage

        -   name: SonarCloud Scan
            uses: SonarSource/sonarqube-scan-action@v6
            env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        -   name: SonarCloud Quality Gate
            uses: SonarSource/sonarqube-quality-gate-action@master
            timeout-minutes: 5
            env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


    # ---------- Análisis de seguridad: Snyk ----------
    security-snyk:
        name: Snyk
        runs-on: ubuntu-latest
        needs: validate
        steps:
        -   uses: actions/checkout@v4

        -   name: Setup pnpm
            uses: pnpm/action-setup@v4

        -   name: Setup Node
            uses: actions/setup-node@v4
            with:
                node-version: 22
                cache: pnpm

        -   run: pnpm install --frozen-lockfile

        -   name: Install Snyk CLI
            run: npm install -g snyk

        -   name: Scan Dependencies
            run: snyk test --severity-threshold=high --all-projects
            env:
                SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

        -   name: Upload dependency report
            if: always()
            run: snyk monitor --project-name=landing-page-deps
            env:
                SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

        -   name: Build Docker image
            run: |
                docker build \
                    --build-arg VITE_CONTACT_API_URL="${{ secrets.VITE_CONTACT_API_URL }}" \
                    -t landing-scan:latest .

        -   name: Scan Docker Image
            run: snyk container test landing-scan:latest --severity-threshold=high --file=Dockerfile
            env:
                SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

        -   name: Upload image report
            if: success()
            run: |
                snyk container monitor landing-scan:latest \
                    --file=Dockerfile \
                    --project-name=landing-page-image
            env:
                SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}


    # ---------- Punto de convergencia de calidad ----------
    quality-gate:
        name: Quality Gate
        runs-on: ubuntu-latest
        needs:
            - sonarcloud
            - security-snyk
        steps:
            -   name: Quality Gate Passed
                run: |
                    echo ""
                    echo "✔ SonarCloud"
                    echo "✔ Snyk"
                    echo ""
                    echo "Ready to build Docker image"


    # ---------- Build y publicación (solo push a main) ----------
    build-and-push:
        name: Build & Push Docker
        runs-on: ubuntu-latest
        needs: quality-gate
        if: github.event_name == 'push'
        environment: production
        steps:
            -   uses: actions/checkout@v4

            -   name: Login DockerHub
                uses: docker/login-action@v3
                with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            -   name: Setup Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Build & Push
                uses: docker/build-push-action@v6
                with:
                    context: .
                    platforms: linux/amd64
                    push: true
                    tags: |
                        ${{ secrets.DOCKERHUB_USERNAME }}/landing-page:latest
                        ${{ secrets.DOCKERHUB_USERNAME }}/landing-page:${{ github.sha }}
                    build-args: |
                        VITE_CONTACT_API_URL=${{ secrets.VITE_CONTACT_API_URL }}


    # ---------- Despliegue vía SSM (solo push a main) ----------
    deploy:
        name: Deploy EC2 via SSM
        runs-on: ubuntu-latest
        needs: build-and-push
        if: github.event_name == 'push'
        environment: production
        permissions:
            id-token: write
            contents: read
        steps:
        -   name: Configure AWS Credentials
            uses: aws-actions/configure-aws-credentials@v4
            with:
                role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                aws-region: ${{ secrets.AWS_REGION }}

        -   name: Find EC2 Instance
            id: find
            run: |
                INSTANCE_ID=$(aws ec2 describe-instances \
                    --filters "Name=tag:Name,Values=landing-page-gm-server" \
                            "Name=instance-state-name,Values=running" \
                    --query "Reservations[0].Instances[0].InstanceId" \
                    --output text)
                echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

        -   name: Deploy using SSM
            run: |
                COMMAND_ID=$(aws ssm send-command \
                    --instance-ids "${{ steps.find.outputs.instance_id }}" \
                    --document-name "AWS-RunShellScript" \
                    --parameters 'commands=["cd /home/ubuntu/landing && docker compose pull && docker compose up -d && docker image prune -f"]' \
                    --query "Command.CommandId" \
                    --output text)
                aws ssm wait command-executed \
                    --command-id "$COMMAND_ID" \
                    --instance-id "${{ steps.find.outputs.instance_id }}" || true
                STATUS=$(aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "${{ steps.find.outputs.instance_id }}" \
                    --query "Status" \
                    --output text)
                echo "Deployment Status: $STATUS"
                if [ "$STATUS" != "Success" ]; then
                    aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "${{ steps.find.outputs.instance_id }}" \
                    --query "StandardErrorContent" \
                    --output text
                    exit 1
                fi
                echo "Deployment completed successfully."